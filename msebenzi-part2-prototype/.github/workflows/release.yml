name: Signed release build

# Builds the SIGNED release APK + Android App Bundle (the .aab file Google Play requires).
# Runs when you push a version tag, e.g.:
#     git tag -a final-poe -m "Final PoE submission" && git push origin final-poe
# or manually from the Actions tab.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   MSEBENZI_KEYSTORE_BASE64   base64 of your upload keystore  (see docs/SETUP_GUIDE.md, section 5)
#   MSEBENZI_KEYSTORE_PASSWORD, MSEBENZI_KEY_ALIAS, MSEBENZI_KEY_PASSWORD
# Optional: GOOGLE_WEB_CLIENT_ID (Google sign-in), GOOGLE_SERVICES_JSON (push notifications)
on:
  push:
    tags: [ "v*", "final-poe*" ]
  workflow_dispatch:

jobs:
  release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      MSEBENZI_KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      MSEBENZI_KEYSTORE_PASSWORD: ${{ secrets.MSEBENZI_KEYSTORE_PASSWORD }}
      MSEBENZI_KEY_ALIAS: ${{ secrets.MSEBENZI_KEY_ALIAS }}
      MSEBENZI_KEY_PASSWORD: ${{ secrets.MSEBENZI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore from secret
        env:
          KEYSTORE_B64: ${{ secrets.MSEBENZI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > release.jks
          else
            echo "::warning::No keystore secret found - the release APK will be unsigned."
          fi

      - name: Restore google-services.json (push notifications), if provided
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then echo "$GS_JSON" > android/app/google-services.json; fi

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: msebenzi-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Play Store bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: msebenzi-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
